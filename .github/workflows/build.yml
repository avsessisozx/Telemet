name: APK derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test ve derleme
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Hataları özetle
        if: failure()
        run: |
          # Derleme hatalarını herkese açık "annotation" olarak yaz; böylece günlüğü indirmeden görülebilir.
          if [ -f build.log ]; then
            errors=$(grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" -A4 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Derleme hatası::${errors}"
            {
              echo '### Derleme hatası'
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test sonuçlarını özetle
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -gt 0 ]; then
            total=$(grep -ho 'tests="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
            failed=$(grep -ho 'failures="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
            echo "### Testler: $total çalıştı, $failed başarısız" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Testler::$total test çalıştı, $failed başarısız"
          fi

      - name: APK'yı adlandır
        id: apk
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Telemet-${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### APK hazır: Telemet-${version}.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Telemet-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Sürüm yayınla (Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Telemet ${{ steps.apk.outputs.version }}
          make_latest: true
          files: out/*.apk
          body: |
            Telefondan indirip kurmak için aşağıdaki **Telemet-${{ steps.apk.outputs.version }}.apk** dosyasına dokunun.

            Değişiklik: ${{ github.event.head_commit.message }}
